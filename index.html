<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LED Construction Board</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="display-board">
        <!-- Main Title -->
        <div class="main-header">CONSTRUCTION BOARD</div>
        <!-- Put this in the top row of your dashboard layout -->
        

<div style="color: white; padding: 5px; font-weight: bold; font-family: monospace; font-size: 5px; display: flex; justify-content: space-around; white-space: nowrap; overflow: hidden;">
    <span id="live-date">DATE: --/--/----</span>
    <span id="live-time">TIME: --:--:-- --</span>
</div>


        <!-- Data Grid Table -->
        <table class="data-table">
            <thead>
                <tr>
                    <th style="width: 42%;">PARAMETER</th>
                    <th style="width: 28%;">COUNT</th>
                    <th style="width: 30%;">UNIT</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="col-param">TEMPERATURE</td>
                    <td class="col-count" id="val-temp">---</td>
                    <td class="col-unit">°C</td>
                </tr>
                <tr>
                    <td class="col-param">HUMIDITY</td>
                    <td class="col-count" id="val-humid">---</td>
                    <td class="col-unit">%</td>
                </tr>
                <tr>
                    <td class="col-param">PM2.5</td>
                    <td class="col-count" id="val-pm25">---</td>
                    <td class="col-unit">&micro;g/m&sup3;</td>
                </tr>
                <tr>
                    <td class="col-param">PM10</td>
                    <td class="col-count" id="val-pm10">----</td>
                    <td class="col-unit">&micro;g/m&sup3;</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
