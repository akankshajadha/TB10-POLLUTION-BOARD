<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LED Construction Board</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="display-board">
        <!-- Main Title -->
        <div class="main-header">CONSTRUCTION BOARD</div>
        
        <!-- Date & Time Row -->
        <div class="datetime-row">
            <div class="date-box" id="live-date">DATE:01/10/2026</div>
            <div class="time-box" id="live-time">TIME:11:13:08 AM</div>
        </div>

        <!-- Data Grid Table -->
        <table class="data-table">
            <thead>
                <tr>
                    <th style="width: 42%;">PARAMETER</th>
                    <th style="width: 28%;">COUNT</th>
                    <th style="width: 30%;">UNIT</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="col-param">TEMPERATURE</td>
                    <td class="col-count" id="val-temp">31.1</td>
                    <td class="col-unit">°C</td>
                </tr>
                <tr>
                    <td class="col-param">HUMIDITY</td>
                    <td class="col-count" id="val-humid">62</td>
                    <td class="col-unit">%</td>
                </tr>
                <tr>
                    <td class="col-param">PM2.5</td>
                    <td class="col-count" id="val-pm25">44</td>
                    <td class="col-unit">µg/m³</td>
                </tr>
                <tr>
                    <td class="col-param">PM10</td>
                    <td class="col-count" id="val-pm10">57</td>
                    <td class="col-unit">µg/m³</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
