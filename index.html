<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Construction Board</title>
    <!-- Links to your separate style sheet file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <!-- Main Header Title -->
        <div class="title" id="board-title">CONSTRUCTION BOARD</div>

        <!-- Real-Time Date/Time Bar -->
        <div class="datetime-row">
            <div>DATE:<span id="current-date">03/10/2026</span></div>
            <div>TIME:<span id="current-time">11:11:01 AM</span></div>
        </div>

        <!-- Clean Grid Table Matrix -->
        <table>
            <thead>
                <tr>
                    <th class="header-param">PARAMETER</th>
                    <th class="header-count">COUNT</th>
                    <th class="header-unit">UNIT</th>
                </tr>
            </thead>
            <tbody>
                <!-- Temperature Row -->
                <tr>
                    <td class="label">TEMPERATURE</td>
                    <td class="value" id="temp-val">30.4</td>
                    <td class="unit">&deg;C</td>
                </tr>
                <!-- Humidity Row -->
                <tr>
                    <td class="label">HUMIDITY</td>
                    <td class="value" id="hum-val">75</td>
                    <td class="unit">%</td>
                </tr>
                <!-- PM2.5 Row -->
                <tr>
                    <td class="label">PM2.5</td>
                    <td class="value" id="pm25-val">20</td>
                    <td class="unit">&mu;g/m&sup3;</td>
                </tr>
                <!-- PM10 Row -->
                <tr>
                    <td class="label">PM10</td>
                    <td class="value" id="pm10-val">32</td>
                    <td class="unit">&mu;g/m&sup3;</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Links to your separate logic script file -->
    <script src="script.js"></script>
</body>
</html>
